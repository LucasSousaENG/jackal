map_type: costmap
origin_z: 0.0
z_resolution: 1
z_voxels: 2

obstacle_range: 2.5
raytrace_range: 3.0

publish_voxel_map: false
transform_tolerance: 0.5
meter_scoring: true

# Demarcacoes xy referentes as coordenadas do vertice da area do robo. E possivel adicionar uma area de seguranca ao redor do robo (usavel junto com o 2D nav)
footprint: [[-0.21, -0.165], [-0.21, 0.165], [0.21, 0.165], [0.21, -0.165]]
footprint_padding: 0.05

plugins:
- {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
- {name: inflater_layer, type: "costmap_2d::InflationLayer"}

obstacles_layer:
  observation_sources: points
  points: {sensor_frame: camera2_link, data_type: PointCloud2, topic: /camera2/depth/points, marking: true, clearing: true, min_obstacle_height: 0.05, max_obstacle_height: 2.0, obstacle_range: 2.5, raytrace_range: 3.0}

inflater_layer:
 inflation_radius: 0.30
